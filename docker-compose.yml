version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fsc-portal-db
    environment:
      POSTGRES_USER: fsc_portal
      POSTGRES_PASSWORD: fsc_portal_dev
      POSTGRES_DB: fsc_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsc_portal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portal-network

  # Redis Cache (Optional but recommended)
  redis:
    image: redis:7-alpine
    container_name: fsc-portal-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portal-network

volumes:
  postgres_data:
  redis_data:

networks:
  portal-network:
    driver: bridge
